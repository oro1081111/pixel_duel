name: Apply expert purchase strategy update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-expert-purchase-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Recover and apply verified patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          old = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/apply-expert-purchase-update.yml'],
              text=True,
          )
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = old.index(start_marker) + len(start_marker)
          end = old.index(end_marker, start)
          lines = old[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_purchase.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_purchase.py

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/purchase.ts src/main.ts src/sim/game.ts
          git commit -m "Use winning-play purchase strategy for expert AI"
          git push origin HEAD:main
