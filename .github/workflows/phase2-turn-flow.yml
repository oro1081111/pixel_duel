name: Phase 2 turn flow

on:
  push:
    branches: [agent/phase2-turn-flow-work]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-turn-flow-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture seeded baseline
        run: npx tsx .github/scripts/turn_flow_seeded_snapshot.ts > /tmp/turn-flow-before.json
      - name: Apply phase two refactor
        run: |
          python .github/scripts/patch_phase2_turn_flow.py
          sed -i "s/if (!transition\.advanced) {/if ('blockReason' in transition) {/g" src/main.ts src/sim/game.ts
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Turn flow unit checks
        run: npm run test:turn-flow
      - name: Verify seeded behavior parity
        run: |
          npx tsx .github/scripts/turn_flow_seeded_snapshot.ts > /tmp/turn-flow-after.json
          diff -u /tmp/turn-flow-before.json /tmp/turn-flow-after.json
      - name: Diff hygiene
        run: git diff --check
      - name: Remove temporary tooling
        run: |
          rm .github/scripts/turn_flow_seeded_snapshot.ts
          rm .github/scripts/patch_phase2_turn_flow.py
          rm .github/workflows/phase2-turn-flow.yml
      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify turn flow across UI and simulation"
          git push origin HEAD:agent/phase2-turn-flow-work
